# ref: https://github.com/actions/runner-images
name: amd64 Windows CMake

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

# Building using the github runner environement directly.
jobs:
  native:
    strategy:
      matrix:
        cmake: [
          {name: "VS26", generator: "Visual Studio 18 2026", config: Release},
          {name: "VS26", generator: "Visual Studio 18 2026", config: Debug},
        ]
      fail-fast: false
    name: amd64•Windows•CMake(${{matrix.cmake.name}},${{matrix.cmake.config}})
    runs-on: windows-latest
    env:
      deps_src_key: amd64_windows_deps_src
      deps_build_key: amd64_windows_deps_build_${{matrix.cmake.config}}
      SCCACHE_GHA_ENABLED: "true"
      CTEST_OUTPUT_ON_FAILURE: 1
    steps:
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.10
      - uses: actions/checkout@v7
      - name: Check CMake
        run: |
          cmake --version
          cmake -G || true
      - name: Configure
        run: >
          cmake -S. -Bbuild
          -G "${{matrix.cmake.generator}}"
          -DCMAKE_CONFIGURATION_TYPES=${{matrix.cmake.config}}
          -DCMAKE_INSTALL_PREFIX=install
      - name: Build
        run: >
          cmake --build build
          --config ${{matrix.cmake.config}}
          --target ALL_BUILD
          -v -j2
      - name: Test
        run: >
          cmake --build build
          --config ${{matrix.cmake.config}}
          --target RUN_TESTS
          -v
      - name: Install
        run: >
          cmake --build build
          --config ${{matrix.cmake.config}}
          --target INSTALL
          -v

  amd64_windows_cmake:
    runs-on: ubuntu-latest
    needs: native
    steps:
      - uses: actions/checkout@v7
